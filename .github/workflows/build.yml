name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk   out/VideoDownloader.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/VideoDownloader-old-phones.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk      out/VideoDownloader-x86_64.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          TITLE="منزّل الفيديو $TAG"
          NOTES="حمّل VideoDownloader.apk لمعظم الجوالات الحديثة. للجوالات القديمة: VideoDownloader-old-phones.apk"
          # حذف المسودات العالقة من محاولات سابقة
          for t in $(gh release list --limit 50 --json tagName,isDraft -q '.[]|select(.isDraft)|.tagName'); do
            [ "$t" != "$TAG" ] && gh release delete "$t" -y --cleanup-tag || true
          done
          ok=0
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" out/*.apk --clobber && \
              gh release edit "$TAG" --draft=false --latest && ok=1 && break
            else
              gh release create "$TAG" out/*.apk --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA" --latest && ok=1 && break
            fi
            echo "retry $i"; sleep 30
          done
          [ "$ok" = 1 ]
