name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk   out/VideoDownloader.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/VideoDownloader-old-phones.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk      out/VideoDownloader-x86_64.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-apk
          path: out/*.apk

      - name: Publish to apk branch (reliable, bypasses Releases API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pub && cp out/*.apk pub/
          cd pub
          git init -q
          git checkout -q -b apk
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK build v1.0.${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk

      - name: Publish GitHub release (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/*.apk --title "منزّل الفيديو $TAG" --notes "حمّل VideoDownloader.apk" --target "$GITHUB_SHA" --latest || true
