name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk   out/VideoDownloader.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/VideoDownloader-old-phones.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk      out/VideoDownloader-x86_64.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: منزّل الفيديو v1.0.${{ github.run_number }}
          body: |
            حمّل **VideoDownloader.apk** (لمعظم الجوالات الحديثة).
            إذا لم يعمل على جوال قديم، حمّل **VideoDownloader-old-phones.apk**.
          files: out/*.apk
          make_latest: true
